<!doctype html>
<!--
  PROTOTYPE for #135, the manual's look: throwaway, kept on prototype/manual-look only.
  Three directions for one step, "lower the yoke on, holding it by the chin", switchable with
  ?variant=A|B|C, the arrows in the bottom bar, or ← →. Open the file in a browser; the line
  art is PROTOTYPE-art.js, generated by board/scripts/PROTOTYPE-manual-art.ts.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manual look prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="PROTOTYPE-art.js"></script>
<style>
  :root {
    --orange: #e8772e;
    --ink: #16191d;
    --grey: #686d73;
    --ok: #2f8a4e;
    --no: #c8372d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { -webkit-font-smoothing: antialiased; }
  .step svg { display: block; width: 100%; height: auto; overflow: visible; }

  /* Line art, shared: every variant sets the --* tokens below. */
  .step svg path, .step svg circle { fill: none; stroke: none; }
  .step svg .ln { stroke: var(--line); stroke-width: var(--lw); stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .step svg .thin { stroke-width: calc(var(--lw) * 0.6); }
  .step svg .top, .step svg .board, .step svg .pad, .step svg .skin, .step svg .markbg { fill: var(--face); }
  .step svg .side { fill: var(--side); }
  .step svg .side2, .step svg .part { fill: var(--side2); }
  .step svg .fuse { fill: var(--side); }
  .step svg .barrier { fill: var(--side2); }
  .step svg .hole { fill: var(--hole); }
  .step svg .arrow { fill: var(--orange); }
  .step svg .guide { stroke: var(--orange); stroke-width: calc(var(--lw) * 0.8); stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
  .step svg .crack { stroke: var(--no); stroke-width: calc(var(--lw) * 1.6); stroke-linejoin: miter; vector-effect: non-scaling-stroke; }
  .step svg .ghost .ln { stroke: var(--orange); }
  .step svg .ghost .board { fill: none; }
  .step svg .ghost .hole, .step svg .ghost .top { fill: none; }
  .step svg text { font: 600 2px var(--mono, monospace); fill: var(--line); }

  /* ── Hand-drawn marks, shared ─────────────────────────────────────────────────────── */
  .mark { display: inline-grid; place-items: center; border-radius: 50%; flex: none; }
  .mark svg { width: 100%; height: 100%; }
  .step .mark path, .step .tri path { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .step .tri { width: 24px; height: auto; }

  /* ═════ A: Flat-pack ═══════════════════════════════════════════════════════════════════
     Paper, black line, a big number and almost no words. The drawing carries the step. */
  [data-v="A"] {
    --line: #16191d; --lw: 1.25px; --face: #fff; --side: #ecebe8; --side2: #d9d8d4; --hole: #c9c8c4;
    background: #fff; color: var(--ink); font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
  }
  [data-v="A"] .step { max-width: 760px; margin: 0 auto; padding: 24px 16px 96px; }
  [data-v="A"] .head { display: flex; align-items: flex-start; gap: 16px; }
  [data-v="A"] .num { font-size: 88px; line-height: 0.8; font-weight: 700; letter-spacing: -0.04em; }
  [data-v="A"] .crumb { font-size: 13px; color: var(--grey); letter-spacing: 0.04em; text-transform: uppercase; margin-top: 2px; }
  [data-v="A"] .cap { font-size: 19px; line-height: 1.3; margin: 6px 0 0; max-width: 30ch; }
  [data-v="A"] .main { margin: 20px -8px 8px; }
  [data-v="A"] .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  [data-v="A"] .frame { position: relative; border: 2px solid var(--ink); border-radius: 14px; padding: 18px 12px 12px; aspect-ratio: 1 / 0.82; display: grid; place-items: center; }
  [data-v="A"] .frame .mark { position: absolute; top: -18px; left: 12px; width: 36px; height: 36px; background: #fff; border: 2px solid var(--ink); }
  [data-v="A"] .frame.ok .mark { color: var(--ok); }
  [data-v="A"] .frame.no .mark { color: var(--no); }
  [data-v="A"] .frame.no .mark { border-color: var(--no); }
  [data-v="A"] .frame.ok .mark { border-color: var(--ok); }
  [data-v="A"] .frame .mark path { stroke-width: 3; }
  [data-v="A"] .frame svg { max-height: 100%; }
  [data-v="A"] .warn { display: flex; gap: 10px; align-items: center; margin-top: 20px; padding-top: 14px; border-top: 2px solid var(--ink); font-size: 16px; }
  [data-v="A"] .warn .tri { width: 28px; height: 25px; flex: none; color: var(--orange); }
  [data-v="A"] .warn .tri path { stroke-width: 2.4; }
  [data-v="A"] .after { display: flex; align-items: center; gap: 12px; margin-top: 20px; color: var(--grey); font-size: 14px; }
  [data-v="A"] .after .thumb { width: 120px; flex: none; }
  [data-v="A"] .after .thumb .ln { stroke-width: 0.8px; }

  /* ═════ B: Bench card ═════════════════════════════════════════════════════════════════
     A workshop card: dark title band, the drawing beside the words on a wide screen, the
     fit shown as a dimensioned detail, and the ✓/✗ as small plan views. */
  [data-v="B"] {
    --line: #16191d; --lw: 1px; --face: #fff; --side: #e6e7e8; --side2: #c9ccd0; --hole: #9aa0a6; --mono: "IBM Plex Mono";
    background: #eef0f1; color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif;
  }
  [data-v="B"] .step { max-width: 980px; margin: 0 auto; padding: 16px 16px 96px; }
  [data-v="B"] .card { background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 0 #d5d8db, 0 8px 24px -16px rgba(22,25,29,.35); }
  [data-v="B"] .band { background: var(--ink); color: #fff; display: flex; align-items: stretch; }
  [data-v="B"] .band .num { background: var(--orange); color: var(--ink); font: 600 28px/1 "IBM Plex Mono", monospace; padding: 14px 16px; display: grid; place-items: center; }
  [data-v="B"] .band .t { padding: 12px 16px; }
  [data-v="B"] .band .crumb { font: 400 12px "IBM Plex Mono", monospace; color: #a9aeb3; letter-spacing: .04em; }
  [data-v="B"] .band h1 { font-size: 20px; line-height: 1.25; margin: 2px 0 0; font-weight: 600; }
  [data-v="B"] .warn { background: #fff4ec; border-bottom: 1px solid #f3c9a9; color: #7a3a10; padding: 10px 16px; font-size: 14px; display: flex; gap: 10px; align-items: center; }
  [data-v="B"] .warn .tri { width: 20px; height: 18px; flex: none; color: var(--orange); }
  [data-v="B"] .warn .tri path { stroke-width: 2.2; }
  [data-v="B"] .body { display: grid; grid-template-columns: 1fr; }
  [data-v="B"] .fig { padding: 16px; background-image: linear-gradient(#f1f2f3 1px, transparent 1px), linear-gradient(90deg, #f1f2f3 1px, transparent 1px); background-size: 16px 16px; }
  [data-v="B"] .side { padding: 16px; border-top: 1px solid #e3e5e7; }
  [data-v="B"] .side p { margin: 0 0 12px; font-size: 15px; line-height: 1.45; }
  [data-v="B"] .lbl { font: 600 11px "IBM Plex Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--grey); margin: 16px 0 6px; }
  [data-v="B"] .detail { border: 1px solid #d5d8db; border-radius: 4px; padding: 8px; }
  [data-v="B"] .detail text { font-size: 2px; }
  [data-v="B"] .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  [data-v="B"] .pair figure { margin: 0; border: 1px solid #d5d8db; border-radius: 4px; padding: 8px; }
  [data-v="B"] .pair figcaption { display: flex; gap: 6px; align-items: center; font-size: 13px; margin-top: 6px; }
  [data-v="B"] .pair .mark { width: 18px; height: 18px; color: #fff; }
  [data-v="B"] .pair .mark path { stroke-width: 3.2; }
  [data-v="B"] .pair .ok .mark { background: var(--ok); }
  [data-v="B"] .pair .no .mark { background: var(--no); }
  [data-v="B"] .pair svg .ln { stroke-width: .8px; }
  [data-v="B"] .foot { display: flex; justify-content: space-between; font: 400 11px "IBM Plex Mono", monospace; color: var(--grey); padding: 8px 16px; border-top: 1px solid #e3e5e7; }
  @media (min-width: 760px) {
    [data-v="B"] .body { grid-template-columns: 1.55fr 1fr; }
    [data-v="B"] .side { border-top: 0; border-left: 1px solid #e3e5e7; }
  }

  /* ═════ C: Storyboard ═════════════════════════════════════════════════════════════════
     The step as three frames, grip → lower → seated, with the ✗ as its own frame. Warm
     paper, orange pushed hard, a condensed face for the numbers. */
  [data-v="C"] {
    --line: #2a2018; --lw: 1.4px; --face: #fffaf3; --side: #f1e4d3; --side2: #e2cdb3; --hole: #cdb595;
    background: #f6efe4; color: #2a2018; font-family: "Barlow", system-ui, sans-serif;
  }
  [data-v="C"] .step { max-width: 1040px; margin: 0 auto; padding: 0 0 96px; }
  [data-v="C"] .hero { background: var(--orange); color: #1d140c; padding: 20px 16px 18px; position: relative; overflow: hidden; }
  [data-v="C"] .hero .big { position: absolute; right: -6px; top: -34px; font: 700 180px/1 "Barlow Condensed", sans-serif; color: rgba(255,255,255,.28); }
  [data-v="C"] .hero .crumb { font: 600 13px "Barlow Condensed", sans-serif; letter-spacing: .12em; text-transform: uppercase; }
  [data-v="C"] .hero h1 { font: 700 34px/1.02 "Barlow Condensed", sans-serif; margin: 6px 0 0; max-width: 16ch; text-transform: uppercase; position: relative; }
  [data-v="C"] .warn { margin: 0; padding: 10px 16px; background: #1d140c; color: #fbe6d4; font-size: 15px; display: flex; gap: 10px; align-items: center; }
  [data-v="C"] .warn .tri { width: 20px; height: 18px; color: var(--orange); flex: none; }
  [data-v="C"] .warn .tri path { stroke-width: 2.2; }
  [data-v="C"] .strip { display: grid; grid-template-columns: 1fr; gap: 14px; padding: 16px; }
  [data-v="C"] .fr { background: var(--face); border-radius: 18px; padding: 12px 12px 14px; position: relative; display: flex; flex-direction: column; }
  [data-v="C"] .fr .tag { font: 700 22px/1 "Barlow Condensed", sans-serif; display: flex; align-items: center; gap: 8px; }
  [data-v="C"] .fr .tag b { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #1d140c; color: #fff; font-size: 17px; }
  [data-v="C"] .fr .art { flex: 1; display: grid; place-items: center; padding: 6px 4px; }
  [data-v="C"] .fr p { margin: 0; font-size: 15px; line-height: 1.35; }
  [data-v="C"] .fr.no { outline: 3px solid var(--no); outline-offset: -3px; }
  [data-v="C"] .fr.no .tag b { background: var(--no); }
  [data-v="C"] .fr .mark { width: 30px; height: 30px; color: #fff; }
  [data-v="C"] .fr .mark path { stroke-width: 3.2; }
  [data-v="C"] .fr.no .mark { background: var(--no); }
  [data-v="C"] .fr.ok .mark { background: var(--ok); }
  @media (min-width: 720px) {
    [data-v="C"] .strip { grid-template-columns: 1fr 1.6fr 1fr; align-items: stretch; }
    [data-v="C"] .fr.no { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 16px; }
    [data-v="C"] .fr.no .art { flex: 0 0 34%; }
  }

  /* ── The bar: not part of the design under review ───────────────────────────────── */
  .proto-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; background: #111; color: #fff; border-radius: 999px; padding: 6px; font: 600 13px system-ui, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.35); z-index: 9; white-space: nowrap; }
  .proto-bar button { all: unset; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #2b2b2b; }
  .proto-bar button:hover { background: #444; }
  .proto-bar span { padding: 0 10px; }
  .proto-bar span i { font-style: normal; color: #f0a46e; }

  /* ── Print: one step per page, the bar gone ─────────────────────────────────────── */
  @page { size: A4; margin: 14mm; }
  @media print {
    .proto-bar { display: none; }
    body { background: #fff !important; }
    .step { padding: 0 !important; max-width: none !important; break-after: page; break-inside: avoid; }
    [data-v="B"] .card { box-shadow: none; border: 1px solid #c9ccd0; }
    [data-v="B"] .body { grid-template-columns: 1.55fr 1fr; }
    [data-v="B"] .side { border-top: 0; border-left: 1px solid #e3e5e7; }
    [data-v="C"] .strip { grid-template-columns: 1fr 1.6fr 1fr; }
    [data-v="C"] .fr { border: 1.5px solid #e2cdb3; }
    [data-v="C"] .fr.no { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 16px; }
    [data-v="C"] .fr.no .art { flex: 0 0 34%; }
    [data-v="A"] .main { margin: 8px 0; }
    [data-v="A"] .main svg { max-height: 120mm; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div class="proto-bar" role="navigation" aria-label="Prototype variants">
  <button id="prev" aria-label="Previous variant">←</button>
  <span id="label"></span>
  <button id="next" aria-label="Next variant">→</button>
</div>
<script>
  const A = window.ART
  // Hand-drawn marks, in the same round-capped line as the drawings.
  const TICK = '<svg viewBox="-10 -10 20 20"><path d="M-5 0.5 L-1.5 4 L5.5 -4"/></svg>'
  const CROSS = '<svg viewBox="-10 -10 20 20"><path d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5"/></svg>'
  const TRI = '<svg class="tri" viewBox="0 0 28 25"><path d="M14 2 L26 23 H2 Z M14 9.5 V15.5 M14 19.2 V19.4"/></svg>'

  const words = {
    crumb: 'Install · step 3 of 9',
    title: 'Lower the yoke on, holding it by the chin',
    cap: 'All 12 fingers go into their pockets together.',
    warn: 'Never carry or press it by an arm: a bent arm can crack its capacitors.',
  }

  const variants = {
    A: {
      name: 'Flat-pack',
      html: () => `
<article class="step">
  <div class="head">
    <div class="num">3</div>
    <div>
      <div class="crumb">${words.crumb}</div>
      <p class="cap"><b>Hold it by the chin.</b> Lower it on. ${words.cap}</p>
    </div>
  </div>
  <div class="main">${A.lift}</div>
  <div class="pair">
    <div class="frame ok"><span class="mark">${TICK}</span>${A.heldOk}</div>
    <div class="frame no"><span class="mark">${CROSS}</span>${A.heldNo}</div>
  </div>
  <div class="warn">${TRI}<span>${words.warn}</span></div>
  <div class="after"><div class="thumb">${A.seated}</div><span>Done when every finger sits flat on its pad.</span></div>
</article>`,
    },
    B: {
      name: 'Bench card',
      html: () => `
<article class="step">
  <div class="card">
    <div class="band"><div class="num">3</div><div class="t"><div class="crumb">${words.crumb.toUpperCase()}</div><h1>${words.title}</h1></div></div>
    <div class="warn">${TRI}<span>${words.warn}</span></div>
    <div class="body">
      <div class="fig">${A.lift}</div>
      <div class="side">
        <p>${words.cap} They drop in square, with about ±0.6 mm of float at the holes.</p>
        <div class="lbl">Fit, one pocket</div>
        <div class="detail">${A.detail}</div>
        <div class="lbl">Hold</div>
        <div class="pair">
          <figure class="ok">${A.planOk}<figcaption><span class="mark">${TICK}</span>By the chin</figcaption></figure>
          <figure class="no">${A.planNo}<figcaption><span class="mark">${CROSS}</span>By an arm</figcaption></figure>
        </div>
      </div>
    </div>
    <div class="foot"><span>Blade Reader · yoke rev B</span><span>Next: refit the way screws</span></div>
  </div>
</article>`,
    },
    C: {
      name: 'Storyboard',
      html: () => `
<article class="step">
  <header class="hero"><div class="big">3</div><div class="crumb">${words.crumb}</div><h1>Lower it on, by the chin</h1></header>
  <p class="warn">${TRI}<span>${words.warn}</span></p>
  <div class="strip">
    <section class="fr ok"><div class="tag"><b>a</b>Grip <span class="mark">${TICK}</span></div><div class="art">${A.heldOk}</div><p>Both hands on the chin.</p></section>
    <section class="fr"><div class="tag"><b>b</b>Lower</div><div class="art">${A.lift}</div><p>Square to the panel. ${words.cap}</p></section>
    <section class="fr"><div class="tag"><b>c</b>Seated</div><div class="art">${A.seated}</div><p>Every finger flat on its pad.</p></section>
    <section class="fr no"><div class="art">${A.heldNo}</div><div><div class="tag"><span class="mark">${CROSS}</span>Never by an arm</div><p>It has no stiffening. Bend an arm a couple of millimetres and its capacitors can crack.</p></div></section>
  </div>
</article>`,
    },
  }

  const keys = Object.keys(variants)
  const root = document.getElementById('root')
  function show(k) {
    if (!variants[k]) k = 'A'
    document.body.dataset.v = k
    root.innerHTML = variants[k].html()
    document.getElementById('label').innerHTML = `${k} <i>(${variants[k].name})</i>`
    const u = new URL(location.href)
    u.searchParams.set('variant', k)
    history.replaceState(null, '', u)
    return k
  }
  let cur = show(new URLSearchParams(location.search).get('variant') ?? 'A')
  const step = (d) => { cur = show(keys[(keys.indexOf(cur) + d + keys.length) % keys.length]) }
  document.getElementById('prev').onclick = () => step(-1)
  document.getElementById('next').onclick = () => step(1)
  addEventListener('keydown', (e) => {
    const t = e.target
    if (t.closest && t.closest('input, textarea, [contenteditable]')) return
    if (e.key === 'ArrowLeft') step(-1)
    if (e.key === 'ArrowRight') step(1)
  })
</script>
</body>
</html>
