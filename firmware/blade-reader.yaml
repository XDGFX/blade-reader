# Blade Reader yoke, rev B: ESPHome configuration built with your own secrets.yaml.
#
# Flash once over USB-C, then update over Wi-Fi. See firmware/README.md. The board itself is in
# yoke.yaml; this file adds the Wi-Fi, keys and web login, all from secrets.yaml. Boards flashed
# from the browser run blade-reader-generic.yaml instead (docs/design.md, First flash).

substitutions:
  name: blade-reader-a
  friendly_name: Blade Reader A

packages:
  yoke: !include yoke.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name} fallback
    password: !secret fallback_password

captive_portal:

# Home Assistant adopts the board later with this key; nothing needs to change on the board.
api:
  encryption:
    key: !secret api_key

# Updates over Wi-Fi, encrypted with the api key above.
ota:
  - platform: esphome
    encryption: {}

web_server:
  # Covers the page, /events and the buttons. Named, as the default moves to digest in 2027.1.
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password
