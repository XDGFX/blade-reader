# Blade Reader yoke, rev B: first-flash ESPHome configuration.
#
# Flash once over USB-C, then update over Wi-Fi. See firmware/README.md.
# The pin map and multiplexer channels follow board/index.circuit.tsx, board/lib/root.tsx and
# board/lib/root-even.tsx. Currents use the CC6905's nominal 44 mV/A and a 1.65 V zero: they are
# uncalibrated, so expect each way to read a few tenths of an amp off until it is zeroed.

substitutions:
  name: blade-reader-a
  friendly_name: Blade Reader A
  interval: 5s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name} fallback
    password: !secret fallback_password

captive_portal:

# Home Assistant adopts the board later with this key; nothing needs to change on the board.
api:
  encryption:
    key: !secret api_key
  # The board runs on its own until Home Assistant connects, so it mustn't reboot without one.
  reboot_timeout: 0s

# Updates over Wi-Fi, encrypted with the api key above.
ota:
  - platform: esphome
    encryption: {}

# A page at http://<name>.local for testing without Home Assistant.
# No firmware upload on it: its upload is unauthenticated.
web_server:
  port: 80
  version: 3
  ota: false

# Boots into a bare OTA-only mode after repeated failed boots, so a bad update can be undone
# over Wi-Fi without the USB port.
safe_mode:

status_led:
  pin: GPIO1

# Red fault LED, from 3V3, lit when GPIO8 is low. GPIO8 is a strapping pin; its pull-up holds it
# high at boot.
output:
  - platform: gpio
    id: fault_led_out
    pin:
      number: GPIO8
      inverted: true
      ignore_strapping_warning: true

light:
  - platform: binary
    name: "Fault LED"
    output: fault_led_out
    restore_mode: ALWAYS_OFF

# Two 74HC4067s share their selects: S0 to S3 on GPIO7, 10, 5 and 6. Mux 1 reads the odd arm,
# its common on GPIO4; mux 2 the even arm, its common on GPIO3.
cd74hc4067:
  - id: mux_odd
    pin_s0: { number: GPIO7, allow_other_uses: true }
    pin_s1: { number: GPIO10, allow_other_uses: true }
    pin_s2: { number: GPIO5, allow_other_uses: true }
    pin_s3: { number: GPIO6, allow_other_uses: true }
  - id: mux_even
    pin_s0: { number: GPIO7, allow_other_uses: true }
    pin_s1: { number: GPIO10, allow_other_uses: true }
    pin_s2: { number: GPIO5, allow_other_uses: true }
    pin_s3: { number: GPIO6, allow_other_uses: true }

sensor:
  - platform: adc
    id: adc_odd
    pin: GPIO4
    attenuation: 12db
    samples: 16
    update_interval: never
  - platform: adc
    id: adc_even
    pin: GPIO3
    attenuation: 12db
    samples: 16
    update_interval: never

  # Temperature sensors: diode-connected MMBT3904s, −2 mV/°C. Vbe at 25 °C is 0.59 V as read
  # through the ADC, from yoke B on the bench at about 30 °C. Absolute to ±5–10 °C; good enough
  # to see a hot terminal.
  - platform: cd74hc4067
    name: "Chin temperature"
    cd74hc4067_id: mux_odd
    sensor: adc_odd
    number: 1
    update_interval: 30s
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: return 25.0f + (0.59f - x) / 0.002f;
  - platform: cd74hc4067
    name: "Odd arm temperature"
    cd74hc4067_id: mux_odd
    sensor: adc_odd
    number: 14
    update_interval: 30s
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: return 25.0f + (0.59f - x) / 0.002f;
  - platform: cd74hc4067
    name: "Even arm temperature"
    cd74hc4067_id: mux_even
    sensor: adc_even
    number: 8
    update_interval: 30s
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: return 25.0f + (0.59f - x) / 0.002f;
  - platform: internal_temperature
    name: "ESP32 temperature"
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s

  # Each way: current through its sensor and voltage on its line copper. The odd arm's sense
  # line falls with load and reaches mux 1 undivided; the even arm's rises with load and is
  # divided by 0.820 before mux 2.
  - platform: cd74hc4067
    id: way1_current
    name: "Way 1 current"
    cd74hc4067_id: mux_odd
    sensor: adc_odd
    number: 6
    update_interval: ${interval}
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - lambda: return (1.65f - x) / 0.044f;
  - platform: cd74hc4067
    id: way1_voltage
    name: "Way 1 voltage"
    cd74hc4067_id: mux_odd
    sensor: adc_odd
    number: 7
    update_interval: ${interval}
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 15.706  # 100 kΩ over 6.8 kΩ
  - platform: cd74hc4067
    id: way2_current
    name: "Way 2 current"
    cd74hc4067_id: mux_even
    sensor: adc_even
    number: 6
    update_interval: ${interval}
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - lambda: return (x / 0.820f - 1.65f) / 0.044f;
  - platform: cd74hc4067
    id: way2_voltage
    name: "Way 2 voltage"
    cd74hc4067_id: mux_even
    sensor: adc_even
    number: 9
    update_interval: ${interval}
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 15.706  # 100 kΩ over 6.8 kΩ
  - platform: cd74hc4067
    id: way3_current
    name: "Way 3 current"
    cd74hc4067_id: mux_odd
    sensor: adc_odd
    number: 4
    update_interval: ${interval}
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - lambda: return (1.65f - x) / 0.044f;
  - platform: cd74hc4067
    id: way3_voltage
    name: "Way 3 voltage"
    cd74hc4067_id: mux_odd
    sensor: adc_odd
    number: 5
    update_interval: ${interval}
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 15.706  # 100 kΩ over 6.8 kΩ
  - platform: cd74hc4067
    id: way4_current
    name: "Way 4 current"
    cd74hc4067_id: mux_even
    sensor: adc_even
    number: 7
    update_interval: ${interval}
    unit_of_measurement: A
    device_class: current
