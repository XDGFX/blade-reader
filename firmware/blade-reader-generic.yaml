# SPDX-License-Identifier: AGPL-3.0-or-later
# Blade Reader yoke, rev B: the generic image, flashed from the browser with ESP Web Tools.
#
# One image for every yoke, so it holds no secret: Wi-Fi is set at first boot over Improv or the
# fallback access point, Home Assistant sets the API key when it adopts the board, and the page
# has no login. docs/design.md (First flash) says why and what that leaves open. The board itself
# is in yoke.yaml. CI builds this file (.github/workflows/firmware-image.yml).

substitutions:
  name: blade-reader
  friendly_name: Blade Reader
  # CI sets this to the commit it builds; Home Assistant shows it on the device.
  image_version: dev

packages:
  yoke: !include yoke.yaml

esphome:
  # blade-reader-1a2b3c, so two yokes on one network don't clash.
  name_add_mac_suffix: true
  project:
    name: xdgfx.blade-reader
    version: ${image_version}

# No network compiled in. The access point comes up until Wi-Fi is set, and again whenever the
# network is lost for 90 s. It is open: a password in a public image protects nothing.
wifi:
  ap: {}

captive_portal:

# ESP Web Tools asks for the Wi-Fi details over the USB port straight after flashing.
improv_serial:

# No key: Home Assistant sets one when it adopts the board, and the board keeps it in flash. Until
# then the API takes any client on the network.
api:
  encryption: {}

# Takes the API key once Home Assistant has set it, and plain uploads either way.
ota:
  - platform: esphome
