# Builds the manual from manual/ and the board's own geometry, with the generic firmware image
# its Install button flashes under firmware/, and publishes it to GitHub Pages from main. Pull
# requests build it, so a change that breaks a drawing or the image fails there.
name: Manual

on:
  push:
    branches: [main]
    paths: ["manual/**", "board/**", "firmware/**", ".github/workflows/manual.yml", ".github/workflows/firmware-image.yml"]
  pull_request:
    paths: ["manual/**", "board/**", "firmware/**", ".github/workflows/manual.yml", ".github/workflows/firmware-image.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    uses: ./.github/workflows/firmware-image.yml

  build:
    needs: firmware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: board
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run manual
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.firmware.outputs.artifact }}
          path: manual/dist/firmware
      - uses: actions/upload-pages-artifact@v3
        with:
          path: manual/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
