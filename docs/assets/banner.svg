<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">Blade Reader</title>
  <desc id="d">One side of a blade fuse panel seen from above: six fuses, each with its output screw clamped onto a finger of a comb-shaped circuit board that reads the current on that way.</desc>
  <style>
    .bg { fill: #f3f1ec; }
    .ink { fill: #16191d; }
    .muted { fill: #686d73; }
    .line { stroke: #16191d; fill: none; }
    .panel { fill: #e4e1da; stroke: #16191d; stroke-width: 2; }
    .barrier { fill: #cfcbc2; }
    .pcb { fill: #1f5c55; stroke: #16191d; stroke-width: 2; }
    .pad { fill: #d9a441; }
    .chip { fill: #16191d; }
    .screw { fill: #b9bcc0; stroke: #16191d; stroke-width: 1.5; }
    .slot { stroke: #16191d; stroke-width: 2; }
    .read { fill: #e8772e; }
    .read-dim { fill: #e8772e; fill-opacity: .35; }
    .glow { stroke: #e8772e; stroke-width: 2; stroke-linecap: round; }
    .word { font: 700 100px/1 ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; letter-spacing: -4px; }
    .tag { font: 400 25px/1.3 -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .label { font: 600 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 2px; }
    .num { font: 600 19px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111417; }
      .ink { fill: #ebe7de; }
      .muted { fill: #979ca2; }
      .line { stroke: #ebe7de; }
      .panel { fill: #1d2125; stroke: #ebe7de; }
      .barrier { fill: #2a2f34; }
      .pcb { fill: #1f5c55; stroke: #ebe7de; }
      .screw { stroke: #ebe7de; }
      .slot { stroke: #111417; }
      .read { fill: #ff8a3d; }
      .read-dim { fill: #ff8a3d; }
      .glow { stroke: #ff8a3d; }
    }
  </style>

  <rect class="bg" width="1280" height="420"/>

  <!-- Wordmark -->
  <text class="word ink" x="80" y="196">Blade Reader</text>
  <text class="tag muted" x="84" y="248">Current on every way of a blade fuse panel.</text>
  <text class="tag muted" x="84" y="281">Find out which fuse has been quietly eating the battery.</text>
  <line class="glow" x1="84" y1="330" x2="404" y2="330"/>
  <text class="label muted" x="84" y="360">HALL SENSING · ESPHOME · 12/24 V</text>

  <!-- Fuse panel, one long side, seen from above -->
  <rect class="panel" x="790" y="40" width="150" height="340" rx="10"/>
  <g>
    <!-- barriers between the six ways, 55 px pitch -->
    <rect class="barrier" x="898" y="100" width="42" height="5"/>
    <rect class="barrier" x="898" y="155" width="42" height="5"/>
    <rect class="barrier" x="898" y="210" width="42" height="5"/>
    <rect class="barrier" x="898" y="265" width="42" height="5"/>
    <rect class="barrier" x="898" y="320" width="42" height="5"/>
  </g>
  <!-- blade fuses: rating colours (10 A red, 15 A blue, 10 A red, 7.5 A brown, 20 A yellow, 5 A tan) -->
  <g stroke="#16191d" stroke-width="1.5">
    <rect x="815" y="76" width="60" height="24" rx="4" fill="#d2453a"/>
    <rect x="815" y="131" width="60" height="24" rx="4" fill="#3d6fb6"/>
    <rect x="815" y="186" width="60" height="24" rx="4" fill="#d2453a"/>
    <rect x="815" y="241" width="60" height="24" rx="4" fill="#8a5a3c"/>
    <rect x="815" y="296" width="60" height="24" rx="4" fill="#e6c13c"/>
    <rect x="815" y="351" width="60" height="24" rx="4" fill="#c9a77a"/>
  </g>

  <!-- Comb: board along the panel edge, one finger into each way -->
  <path class="pcb" d="M1000 50 H1060 V380 H1000 V362 H905 V338 H1000 V307 H905 V283 H1000 V252 H905 V228 H1000 V197 H905 V173 H1000 V142 H905 V118 H1000 V87 H905 V63 H1000 Z"/>
  <!-- output screws clamping each finger -->
  <g>
    <circle class="screw" cx="922" cy="75" r="9"/><line class="slot" x1="916" y1="75" x2="928" y2="75"/>
    <circle class="screw" cx="922" cy="130" r="9"/><line class="slot" x1="916" y1="130" x2="928" y2="130"/>
    <circle class="screw" cx="922" cy="185" r="9"/><line class="slot" x1="916" y1="185" x2="928" y2="185"/>
    <circle class="screw" cx="922" cy="240" r="9"/><line class="slot" x1="916" y1="240" x2="928" y2="240"/>
    <circle class="screw" cx="922" cy="295" r="9"/><line class="slot" x1="916" y1="295" x2="928" y2="295"/>
    <circle class="screw" cx="922" cy="350" r="9"/><line class="slot" x1="916" y1="350" x2="928" y2="350"/>
  </g>
  <!-- sensors and output studs on the strip -->
  <g>
    <rect class="chip" x="1008" y="68" width="14" height="14" rx="2"/><circle class="pad" cx="1043" cy="75" r="8"/>
    <rect class="chip" x="1008" y="123" width="14" height="14" rx="2"/><circle class="pad" cx="1043" cy="130" r="8"/>
    <rect class="chip" x="1008" y="178" width="14" height="14" rx="2"/><circle class="pad" cx="1043" cy="185" r="8"/>
    <rect class="chip" x="1008" y="233" width="14" height="14" rx="2"/><circle class="pad" cx="1043" cy="240" r="8"/>
    <rect class="chip" x="1008" y="288" width="14" height="14" rx="2"/><circle class="pad" cx="1043" cy="295" r="8"/>
    <rect class="chip" x="1008" y="343" width="14" height="14" rx="2"/><circle class="pad" cx="1043" cy="350" r="8"/>
  </g>

  <!-- Readings -->
  <g class="num">
    <text class="read" x="1084" y="82">2.41 A</text>
    <text class="read" x="1084" y="137">6.90 A</text>
    <text class="read" x="1084" y="192">0.88 A</text>
    <text class="read" x="1084" y="247">3.12 A</text>
    <text class="read" x="1084" y="302">11.6 A</text>
    <text class="read-dim" x="1084" y="357">0.00 A</text>
  </g>
  <text class="label muted" x="790" y="405">FUSE PANEL</text>
  <text class="label muted" x="1000" y="405">STRIP · 6 WAYS</text>
</svg>
