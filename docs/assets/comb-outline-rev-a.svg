<text x="20" y="450" font-weight="bold">Notes</text>
<text x="20" y="468">1. Fingers 9.5 wide on 13.36 pitch, centred on the way screws. Root at the panel edge, R1.0 internal corners.</text>
<text x="20" y="484">2. Tip square at 13.0 inset, R0.5 corners, 1.5 clear of the fuse holder wall.</text>
<text x="20" y="500">3. Ø5.4 round non-plated hole at 8.52 inset: #8-32 (Blue Sea) and M4 (clones), ±0.6 float.</text>
<text x="20" y="516">4. Screws come fully out to fit; the strip slides in at pad height (14.33) and the screws go back through the holes.</text>
<text x="20" y="532">5. Hatched: bare ENIG on the parts face (underside), 3.0 inset to tip, less 0.3 a side: contact with the panel pad.</text>
<text x="20" y="548">6. Dotted ring Ø8.13: bare ENIG washer footprint on the ring face.</text>
<text x="20" y="564">7. Parts face down, ring face up. All parts on the parts face (Economic PCBA is single-sided). No parts on fingers.</text>
<text x="20" y="580">8. 1.6 mm FR-4, 0.3 copper to any routed edge or hole. Clone pitch (13.36–13.6) is inferred; a measured clone gates the fit check.</text>
<defs><marker id="m" markerWidth="1" markerHeight="1"/></defs>
